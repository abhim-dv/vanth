name: Vanth CI

on:
  push:
  pull_request:

jobs:
  # NOTE: the python job runs on pull_request only (not push) because the
  # windows-latest runner intermittently flakes on
  # test_stop_after_restart_kills_runner_and_workload (pid teardown timing after
  # stop_sync). Linux and macOS are covered too: the suite builds workload
  # command strings with tests/shellcmd.py (shlex.join on POSIX, list2cmdline on
  # Windows) so the platform shell executes them correctly everywhere. macOS is
  # limited to one Python version to limit runner cost; Windows and Linux cover
  # both.
  python:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
        exclude:
          - os: macos-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: uv sync --dev
      - run: uv run pytest -q
      - run: uv run python -m compileall -q src tests examples
      - run: uv build
      - name: Smoke installed wheel
        shell: bash
        run: |
          wheels=(dist/*.whl)
          test -e "${wheels[0]}"
          uv run --isolated --no-project --with "${wheels[0]}" python -c "import vanth; print(vanth.__file__)"
      - name: Smoke bundled monitor console script
        shell: bash
        run: |
          wheels=(dist/*.whl)
          test -e "${wheels[0]}"
          uv run --isolated --no-project --with "${wheels[0]}" vanth-monitor --version

  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: astral-sh/setup-uv@v5
      - run: gofmt -l .
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-language fixture conformance
        run: |
          uv run python scripts/generate_go_fixture.py testdata
          go test ./internal/state/ -count=1
      - run: go build ./...
      - name: Fixture matches schema and representative rows
        shell: bash
        run: |
          uv run python - <<'PY'
          import sqlite3
          from vanth.migrations import LATEST_SCHEMA_VERSION
          db = sqlite3.connect('testdata/state/jobs.sqlite')
          assert db.execute('PRAGMA user_version').fetchone()[0] == LATEST_SCHEMA_VERSION
          jobs = {r[0]: r[3] for r in db.execute('SELECT job_id, name, command, status FROM jobs').fetchall()}
          assert jobs == {'job_completed': 'completed', 'job_running': 'running'}, jobs
          ev = {r[0] for r in db.execute('SELECT event_id FROM events').fetchall()}
          assert {'evt_complete', 'evt_progress'} <= ev, ev
          print('fixture semantic check OK')
          PY

  resilience:
    name: Resilience chaos matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: uv sync --dev
      - run: uv run python scripts/chaos_matrix.py
