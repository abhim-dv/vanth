name: Vanth CI

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --dev
      - run: uv run pytest -q
      - run: uv run python -m compileall -q src tests examples
      - run: uv build
      - name: Smoke installed wheel
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          uv run --isolated --no-project --with "$wheel" python -c "import vanth; print(vanth.__file__)"

  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: astral-sh/setup-uv@v5
      - run: gofmt -l .
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-language fixture conformance
        run: |
          uv run python scripts/generate_go_fixture.py testdata
          go test ./internal/state/ -count=1
      - run: go build ./...
      - name: Check fixture is committed and current
        run: git diff --exit-code -- testdata/state/jobs.sqlite
