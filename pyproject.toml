[project]
name = "vanth"
version = "1.0.0"
description = "Event-driven background jobs for agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0,<2.0",
    "loguru>=0.7,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vanth = "vanth.server:main"
vanthd = "vanth.daemon:main"
vanth-codex-notify = "vanth.codex_bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
