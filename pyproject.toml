[project]
name = "vanth"
version = "0.1.0"
description = "Event-driven background jobs for agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vanth = "vanth.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
